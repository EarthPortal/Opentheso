#######################
# Server Configuration
#######################

server:
  port: 8099
  forward-headers-strategy: native
  servlet:
    context-path: /
    session:
      timeout: 30m
  error:
    path: /errorPages/error500.xhtml
    whitelabel:
      enabled: false

logging:
  level:
    org.springframework.web.servlet.resource: ERROR
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

primefaces:
  uploader: native

app:
  security:
    keycloak-enabled: false  # ou false pour désactiver
  neo4j:
    enabled: false

management:
  health:
    neo4j:
      enabled: false

spring:
  application:
    name: opentheso

  thymeleaf:
    check-template-location: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB  # Définit la taille max d'un fichier
      max-request-size: 100MB  # Taille totale max de la requête
  datasource:
    url: jdbc:postgresql://localhost:5433/opentheso
    password: opentheso
    username: opentheso
  jpa:
    show-sql: false
    generate-ddl: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:/changelog/db.changelog.xml
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
      endpoint: /graphql

  # Connexion de KeyCloak
