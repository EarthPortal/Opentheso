settings:
  workLanguage: fr

# clé de cryptage pour les clés d'API OpenARK
crypto:
  openark:
    key: 12345678901234567890123456789012 # 32 caractères exactement

certificats:
  admpriv: ./certificats/admpriv.bin
  cacerts2: /Users/miledrousset/NetBeansProjects22/Opentheso/src/main/resources/certificats/cacerts2
  key: /Users/miledrousset/NetBeansProjects22/Opentheso/src/main/resources/certificats/key.p12

smpt:
  protocol: smtp
  hostname: smtprelay.cnrs.fr
  portNumber: 25
  authorization: false
  mailFrom: opentheso@mom.fr
  transportMail: smtp

neo4j:
  serverName: localhost
  serverPort: 7687
  databaseName: neo4j
  user: neo4j
  password: neo4j1234

ldap:
  security:
    authentication: simple
  server:
    url: ldapr3.mondomaine.fr
  initial:
    context:
      factory: com.sun.jndi.ldap.LdapCtxFactory
  key:
    store:
      password: changeit
      path: /usr/lib/jvm/java-11-openjdk-amd64/lib/security/cacerts
    trust:
      password: changeit
      path: /usr/lib/jvm/java-11-openjdk-amd64/lib/security/cacerts

