#######################
# Server Configuration
#######################

server:
  port: 8099
  forward-headers-strategy: native
  servlet:
    context-path: /
    session:
      cookie:
        name: ${random.value}
      timeout: 30m
  error:
    path: /errorPages/error500.xhtml
    whitelabel:
      enabled: false

logging:
  level:
    org.springframework.web.servlet.resource: ERROR
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

primefaces:
  uploader: native

app:
  security:
    keycloak-enabled: ${KEYCLOAK_ENABLED:false}  # true pour activer le SSO Gaia Data
    # client-id OIDC déclaré dans Keycloak ; sert à lire les rôles dans resource_access.<client-id>.roles
    client-id: ${OIDC_CLIENT_ID:earthdata-earthportal-opentheso}
  neo4j:
    enabled: false

management:
  health:
    neo4j:
      enabled: false

spring:
  application:
    name: opentheso

  thymeleaf:
    check-template-location: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB  # Définit la taille max d'un fichier
      max-request-size: 100MB  # Taille totale max de la requête
  datasource:
    url: jdbc:postgresql://localhost:5433/opentheso

    password: opentheso
    username: opentheso
  jpa:
    show-sql: false
    generate-ddl: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:/changelog/db.changelog.xml

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
      endpoint: /graphql

  mail:
    host: ${smpt.hostname}
    port: ${smpt.portNumber}
    protocol: ${smpt.protocol}
    properties:
      mail.smtp.auth: ${smpt.authorization}
      mail.smtp.starttls.enable: false
    default-encoding: UTF-8

  # Connexion KeyCloak / SSO Gaia Data
  # Décommenter ce bloc + définir OIDC_CLIENT_SECRET (variable d'env) pour tester le SSO en local.
  # Le client doit avoir l'URI de redirection enregistrée côté Keycloak :
  #   {baseUrl}/login/oauth2/code/keycloak
#  security:
#    oauth2:
#      client:
#        registration:
#          keycloak:
#            client-id: ${OIDC_CLIENT_ID:earthdata-earthportal-opentheso}
#            client-secret: ${OIDC_CLIENT_SECRET:}   # NE PAS committer : fournir via variable d'env
#            provider: keycloak
#            authorization-grant-type: authorization_code
#            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
#            scope: openid, profile, email, roles
#        provider:
#          keycloak:
#            issuer-uri: ${OIDC_ISSUER_URI:https://sso.earth-data.fr/realms/gaia-data}


settings:
  workLanguage: fr

crypto:
  key: 12345678901234567890123456789012 # 32 caractères exactement pour la clé d'API locale Opentheso
  openark:
    key: 12345678901234567890123456789012 # 32 caractères exactement pour la clé d'API pour OpenArk


certificats:
  admpriv: ./certificats/admpriv.bin
  cacerts2: /Users/miledrousset/NetBeansProjects22/Opentheso/src/main/resources/certificats/cacerts2
  key: /Users/miledrousset/NetBeansProjects22/Opentheso/src/main/resources/certificats/key.p12

smpt:
  mailFrom: opentheso@mom.fr
  hostname: smtprelay.cnrs.fr
  portNumber: 25
  protocol: smtp
  authorization: false

neo4j:
  serverName: localhost
  serverPort: 7687
  databaseName: neo4j
  user: neo4j
  password: neo4j1234



